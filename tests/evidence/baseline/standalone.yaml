apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-sa-spark-35-jupyter
  labels:
    app: jupyter
    app.kubernetes.io/component: jupyter
    helm.sh/chart: spark-3.5-0.2.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: evidence-sa
    app.kubernetes.io/version: 3.5.7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
      app.kubernetes.io/component: jupyter
  template:
    metadata:
      labels:
        app: jupyter
        app.kubernetes.io/component: jupyter
        app.kubernetes.io/name: spark-3.5
        app.kubernetes.io/instance: evidence-sa
    spec:
      serviceAccountName: spark-35
      securityContext:
        runAsNonRoot: false
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: notebooks
          emptyDir: {}
        - name: notebook-seed
          configMap:
            name: evidence-sa-spark-35-jupyter-notebooks
        - name: jupyter-runtime
          emptyDir: {}
      initContainers:
        - name: seed-demo-notebooks
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /home/jupyter/notebooks
              cp -n /seed/* /home/jupyter/notebooks/ 2>/dev/null || true
          volumeMounts:
            - name: notebook-seed
              mountPath: /seed
            - name: notebooks
              mountPath: /home/jupyter/notebooks
      containers:
        - name: jupyter
          image: "spark-k8s-jupyter:3.5-3.5.7"
          imagePullPolicy: IfNotPresent
          command: ["jupyter-lab"]
          args: ["--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=''", "--NotebookApp.password=''"]
          env:
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
            - name: PYARROW_IGNORE_TIMEZONE
              value: "1"
            - name: HOME
              value: "/home/jupyter"
            - name: JUPYTER_RUNTIME_DIR
              value: "/tmp/jupyter-runtime"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: SPARK_CONNECT_URL
              value: "sc://spark-connect:15002"
          securityContext:

            allowPrivilegeEscalation: false
            runAsUser: 185
            runAsGroup: 185
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8888
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: notebooks
              mountPath: /home/jupyter/notebooks
            - name: jupyter-runtime
              mountPath: /tmp/jupyter-runtime
