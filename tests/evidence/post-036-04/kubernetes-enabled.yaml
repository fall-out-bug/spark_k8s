# Source: spark-3.5/templates/tests/test-connect-grpc.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "test036-spark-35-test-connect-grpc"
  labels:
    helm.sh/chart: spark-3.5-0.2.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: test036
    app.kubernetes.io/version: 3.5.7
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  containers:
    - name: test-connect-grpc
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Testing Spark Connect gRPC port..."
          until nc -z -w 5 test036-spark-35-connect 15002;
          do echo "Waiting for Spark Connect..."; sleep 2; done
          echo "Spark Connect gRPC port is reachable"
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
