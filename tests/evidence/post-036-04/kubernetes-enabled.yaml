# Source: spark-3.5/templates/spark-connect-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: test036-spark-35-connect-config
  labels:
    helm.sh/chart: spark-3.5-0.2.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: test036
    app.kubernetes.io/version: 3.5.7
data:
  spark-properties.conf.template: |-
    # Spark Connect Server runs on K8s
    # Driver in pod, executors on K8s cluster
    spark.master=k8s://https://kubernetes.default.svc:443
    spark.driver.bindAddress=0.0.0.0
    spark.driver.host=$(POD_IP)
    spark.driver.port=7078
    spark.driver.blockManager.port=7079
    # K8s executor config (for clients launching executors on K8s)
    spark.kubernetes.namespace=default
    spark.kubernetes.executor.podTemplateFile=/tmp/spark-conf/executor-pod-template.yaml
    spark.kubernetes.executor.request.cores=1
    spark.kubernetes.executor.limit.cores=2
    spark.kubernetes.executor.request.memory=1Gi
    spark.kubernetes.container.image=spark-custom:3.5.7

    # Dynamic allocation
    spark.dynamicAllocation.enabled=true
    spark.dynamicAllocation.shuffleTracking.enabled=true
    spark.dynamicAllocation.minExecutors=0
    spark.dynamicAllocation.maxExecutors=10

    # Executor observability
    spark.kubernetes.executor.podNamePrefix=test036-exec

    # AQE (Adaptive Query Execution) - enabled by default for +20-40% perf
    spark.sql.adaptive.enabled=true
    spark.sql.adaptive.coalescePartitions.enabled=true
    spark.sql.adaptive.skewJoin.enabled=true

    spark.connect.grpc.binding.address=0.0.0.0
    spark.connect.grpc.binding.port=15002
    spark.connect.server.artifactDir=/opt/spark/artifacts

    # Prometheus metrics

    # Ivy cache (for Maven dependencies)
    spark.jars.ivy=/tmp/spark-ivy-cache

    # Disable push-based shuffle (may conflict with PSS restricted)
    spark.shuffle.push.enabled=false
    spark.shuffle.sort.bypassMergeThreshold=0

    # Event log (for History Server)
    spark.eventLog.enabled=true
    spark.eventLog.dir=s3a://spark-logs/events
    # Rolling event log: each 128MB or 5min a new completed file is created; History Server picks it up immediately
    spark.eventLog.rolling.enabled=true
    spark.eventLog.rolling.maxFileSize=128m
    # Hive Metastore configuration
    spark.hadoop.hive.metastore.uris=thrift://test036-hive-metastore:9083
    spark.sql.catalogImplementation=hive
    spark.sql.warehouse.dir=s3a://warehouse/spark-35
    # S3 config
    spark.hadoop.fs.s3a.endpoint=http://minio:9000
    spark.hadoop.fs.s3a.access.key=${AWS_ACCESS_KEY_ID}
    spark.hadoop.fs.s3a.secret.key=${AWS_SECRET_ACCESS_KEY}
    spark.hadoop.fs.s3a.path.style.access=true
    spark.hadoop.fs.s3a.connection.ssl.enabled=false
    spark.hadoop.fs.s3a.connection.SSL.enabled=false
