data:
  executor-pod-template.yaml.template: |-
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app: spark-executor
        spark-version: "3.5.7"
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: spark-35
      containers:
      - name: executor
        securityContext:

          allowPrivilegeEscalation: false
          runAsUser: 185
          runAsGroup: 185
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: spark-local
          mountPath: /opt/spark/work
      volumes:
      - name: tmp
        emptyDir: {}
      - name: spark-local
        emptyDir: {}
