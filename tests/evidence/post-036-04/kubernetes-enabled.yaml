  nyc_taxi_ml_training_pipeline.ipynb: |
    {
     "cells": [
      {
       "cell_type": "markdown",
       "id": "7fb27b941602401d91542211134fc71a",
       "metadata": {},
       "source": [
        "# NYC Taxi: Processing + Model Training Pipeline\n",
        "\n",
        "This demo notebook runs an end-to-end Spark pipeline: data generation, feature processing, model training, evaluation, and result persistence to MinIO/Hive."
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "id": "acae54e37e7d407bbb7b55eff062a284",
       "metadata": {},
       "outputs": [],
       "source": [
        "from pyspark.sql import SparkSession\n",
        "from pyspark.sql.functions import col, rand, when\n",
        "\n",
        "spark = (SparkSession.builder\n",
        "    .appName('nyc-taxi-ml-training-pipeline')\n",
        "    .config('spark.hadoop.fs.s3a.endpoint', 'http://minio:9000')\n",
        "    .config('spark.hadoop.fs.s3a.access.key', 'minioadmin')\n",
        "    .config('spark.hadoop.fs.s3a.secret.key', 'minioadmin')\n",
        "    .config('spark.hadoop.fs.s3a.path.style.access', 'true')\n",
        "    .config('spark.hadoop.fs.s3a.impl', 'org.apache.hadoop.fs.s3a.S3AFileSystem')\n",
        "    .config('spark.hadoop.hive.metastore.uris', 'thrift://spark-infra-spark-35-metastore:9083')\n",
        "    .config('spark.sql.warehouse.dir', 's3a://warehouse/spark-35')\n",
        "    .enableHiveSupport()\n",
        "    .getOrCreate())\n",
        "\n",
        "spark"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "id": "9a63283cbaf04dbcab1f6479b197f3a8",
       "metadata": {},
       "outputs": [],
       "source": [
        "# Synthetic taxi-like training dataset\n",
        "n = 120000\n",
        "base = spark.range(n)\n",
        "df = (base\n",
        "    .withColumn('trip_distance', rand(seed=42) * 25)\n",
        "    .withColumn('passenger_count', (rand(seed=7) * 5 + 1).cast('int'))\n",
        "    .withColumn('hour', (rand(seed=9) * 24).cast('int'))\n",
        "    .withColumn('is_peak', when((col('hour') >= 7) & (col('hour') <= 10), 1).otherwise(0))\n",
        "    .withColumn('fare_amount',\n",
        "        3.0 + col('trip_distance') * 2.2 + col('passenger_count') * 0.9 + col('is_peak') * 4.5 + rand(seed=17) * 2.0\n",
        "    ))\n",
        "\n",
        "df.select('trip_distance', 'passenger_count', 'hour', 'is_peak', 'fare_amount').show(5, truncate=False)"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "id": "8dd0d8092fe74a7c96281538738b07e2",
       "metadata": {},
       "outputs": [],
       "source": [
        "from pyspark.ml.evaluation import RegressionEvaluator\n",
        "from pyspark.ml.feature import VectorAssembler\n",
        "from pyspark.ml.regression import GBTRegressor\n",
        "\n",
        "features = ['trip_distance', 'passenger_count', 'hour', 'is_peak']\n",
        "assembler = VectorAssembler(inputCols=features, outputCol='features')\n",
        "train_df = assembler.transform(df).select('features', col('fare_amount').alias('label'))\n",
        "\n",
        "train, test = train_df.randomSplit([0.8, 0.2], seed=123)\n",
        "model = GBTRegressor(maxIter=30, maxDepth=5, stepSize=0.1).fit(train)\n",
        "pred = model.transform(test)\n",
        "\n",
        "rmse = RegressionEvaluator(metricName='rmse').evaluate(pred)\n",
        "r2 = RegressionEvaluator(metricName='r2').evaluate(pred)\n",
        "print('RMSE:', round(rmse, 4))\n",
        "print('R2:', round(r2, 4))"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "id": "72eea5119410473aa328ad9291626812",
       "metadata": {},
       "outputs": [],
       "source": [
        "from pyspark.sql.functions import lit\n",
        "\n",
        "metrics = spark.createDataFrame([(float(rmse), float(r2), int(n))], ['rmse', 'r2', 'rows'])\n",
        "metrics = metrics.withColumn('run_ts', lit(str(__import__('datetime').datetime.utcnow())))\n",
        "\n",
        "metrics.write.mode('append').parquet('s3a://spark-jobs/model-metrics/nyc-taxi-gbt/')\n",
        "\n",
        "spark.sql(\"CREATE DATABASE IF NOT EXISTS demo_shared LOCATION 's3a://warehouse/spark-35/demo_shared.db'\")\n",
        "metrics.createOrReplaceTempView('m')\n",
        "spark.sql(\"CREATE TABLE IF NOT EXISTS demo_shared.nyc_taxi_training_metrics USING PARQUET LOCATION 's3a://warehouse/spark-35/demo_shared.db/nyc_taxi_training_metrics' AS SELECT * FROM m\")\n",
        "spark.sql(\"SELECT * FROM demo_shared.nyc_taxi_training_metrics ORDER BY run_ts DESC\").show(10, truncate=False)"
       ]
      }
     ],
     "metadata": {
      "kernelspec": {
       "display_name": "Python 3",
       "language": "python",
       "name": "python3"
      },
      "language_info": {
       "name": "python",
       "version": "3.10"
      }
     },
     "nbformat": 4,
     "nbformat_minor": 5
    }

