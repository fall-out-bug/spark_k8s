      app.kubernetes.io/component: connect
  template:
    metadata:
      labels:
        app: spark-connect
        app.kubernetes.io/component: connect
        app.kubernetes.io/name: spark-3.5
        app.kubernetes.io/instance: test036
    spec:
      serviceAccountName: spark-35
      securityContext:
        runAsNonRoot: false
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: spark-connect-config
          configMap:
            name: test036-spark-35-connect-config
        - name: executor-pod-template
          configMap:
            name: test036-spark-35-executor-pod-template
        - name: spark-connect-writable
          emptyDir: {}
        - name: ivy-cache
          emptyDir: {}
        - name: connect-artifacts
          emptyDir: {}
      initContainers:
        - name: render-spark-config
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
          args:
            - >-
              apk add --no-cache gettext &&
              envsubst < /opt/spark/conf-k8s-templates/spark-properties.conf.template > /tmp/spark-conf/spark-defaults.conf &&
              envsubst < /opt/spark/conf-k8s-templates/executor-pod-template.yaml.template > /tmp/spark-conf/executor-pod-template.yaml
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "x"
            - name: AWS_SECRET_ACCESS_KEY
              value: "x"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: IVY_DIR
              value: "/tmp/spark-ivy-cache"
          securityContext:

            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: spark-connect-config
              mountPath: /opt/spark/conf-k8s-templates/spark-properties.conf.template
              subPath: spark-properties.conf.template
            - name: executor-pod-template
              mountPath: /opt/spark/conf-k8s-templates/executor-pod-template.yaml.template
              subPath: executor-pod-template.yaml.template
            - name: spark-connect-writable
              mountPath: /tmp/spark-conf
      containers:
        - name: spark-connect
          image: "spark-custom:3.5.7"
          imagePullPolicy: IfNotPresent
          env:
            - name: SPARK_MODE
              value: "connect"
            - name: SPARK_CONNECT_URL
              value: "sc://0.0.0.0:15002"
            - name: SPARK_CONF_DIR
              value: "/tmp/spark-conf"
            - name: HADOOP_USER_NAME
              value: "spark"
            - name: HADOOP_SECURITY_AUTHENTICATION
              value: "simple"
            - name: SPARK_SUBMIT_OPTS
              value: "-Dhadoop.security.authentication=simple"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: IVY_DIR
              value: "/tmp/spark-ivy-cache"
          securityContext:

            allowPrivilegeEscalation: false
            runAsUser: 185
            runAsGroup: 185
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - "/bin/sh"
            - "-c"
          args:
            - >-
              /opt/spark/bin/spark-submit --properties-file /tmp/spark-conf/spark-defaults.conf --master k8s://https://kubernetes.default.svc:443 --deploy-mode client --conf spark.driver.host=$(POD_IP) --class org.apache.spark.sql.connect.service.SparkConnectServer
          ports:
            - name: grpc
              containerPort: 15002
              protocol: TCP
            - name: driver
              containerPort: 7078
              protocol: TCP
            - name: blockmanager
              containerPort: 7079
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 15002
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 15002
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: spark-connect-config
              mountPath: /opt/spark/conf-k8s-templates/spark-properties.conf.template
              subPath: spark-properties.conf.template
            - name: executor-pod-template
              mountPath: /opt/spark/conf-k8s-templates/executor-pod-template.yaml.template
              subPath: executor-pod-template.yaml.template
            - name: spark-connect-writable
              mountPath: /tmp/spark-conf
            - name: ivy-cache
              mountPath: /tmp/spark-ivy-cache
            - name: connect-artifacts
              mountPath: /opt/spark/artifacts
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
