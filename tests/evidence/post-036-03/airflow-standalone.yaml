  pandas_udf_feature_engineering.ipynb: |
    {
     "cells": [
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "# Feature Engineering with Pandas UDF\n",
        "\n",
        "mapInPandas / applyInPandas for distributed feature engineering."
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "from pyspark.sql import SparkSession\n",
        "from pyspark.sql.functions import rand\n",
        "\n",
        "spark = (SparkSession.builder\n",
        "    .appName('pandas-udf-feature')\n",
        "    .config('spark.hadoop.fs.s3a.endpoint', 'http://minio:9000')\n",
        "    .config('spark.hadoop.fs.s3a.access.key', 'minioadmin')\n",
        "    .config('spark.hadoop.fs.s3a.secret.key', 'minioadmin')\n",
        "    .config('spark.hadoop.fs.s3a.path.style.access', 'true')\n",
        "    .getOrCreate())\n",
        "\n",
        "df = spark.range(5000).withColumn('x', rand(42)).withColumn('y', rand(17))\n",
        "df.show(5)"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "def add_features(pdf_iter):\n",
        "    for pdf in pdf_iter:\n",
        "        pdf['x_squared'] = pdf['x'] ** 2\n",
        "        pdf['xy'] = pdf['x'] * pdf['y']\n",
        "        yield pdf\n",
        "\n",
        "schema = \"id long, x double, y double, x_squared double, xy double\"\n",
        "out = df.mapInPandas(add_features, schema)\n",
        "out.show(5)"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "out.write.mode('overwrite').parquet('s3a://spark-jobs/pandas-udf-features/')"
       ]
      }
     ],
     "metadata": {
      "kernelspec": {
       "display_name": "Python 3",
       "language": "python",
       "name": "python3"
      }
     },
