data:
  nyc_taxi_ml_full_pipeline.py: |
    """NYC Taxi ML full pipeline (Airflow + Spark Standalone via KPO)."""

    import logging
    from datetime import datetime, timedelta

    from airflow import DAG
    from airflow.operators.python import PythonOperator
    from airflow.providers.cncf.kubernetes.operators.pod import KubernetesPodOperator

    logger = logging.getLogger(__name__)

    CONFIG = {
        "namespace": "spark-infra",
        "spark_master": "spark://spark-infra-spark-standalone-master:7077",
        "minio_endpoint": "http://minio.spark-infra.svc.cluster.local:9000",
        # Pushgateway (9091); empty = disabled. Prometheus (9090) does not accept push.
        "pushgateway_url": "",  # Set via PUSHGATEWAY_URL if Pushgateway deployed
        "otel_endpoint": "http://otel-collector.observability.svc.cluster.local:4317",
        "model_version": datetime.now().strftime("%Y%m%d"),
        "mape_threshold": 0.75,
    }

    default_args = {
        "owner": "ml-team",
        "depends_on_past": False,
        "start_date": datetime(2026, 2, 1),
        "retries": 2,
        "retry_delay": timedelta(minutes=5),
    }


    def push_metric(name, value, labels=None):
        """Push metric to Prometheus Pushgateway. No-op if pushgateway_url empty or Pushgateway unavailable."""
        url = str(CONFIG.get("pushgateway_url") or "")
        if not url or ":9091" not in url:
            return  # Pushgateway not configured or wrong port (Prometheus 9090 does not accept push)
        import requests

        labels = labels or {}
        labels["version"] = CONFIG["model_version"]
        label_str = ",".join([f'{k}="{v}"' for k, v in labels.items()])
        payload = f"# TYPE {name} gauge\n{name}{{{label_str}}} {value}\n"
        try:
            requests.post(f"{url}/metrics/job/nyc_taxi_ml_pipeline", data=payload, timeout=5)
        except Exception as exc:
            logger.debug(f"Pushgateway push skipped for {name}: {exc}")


    def build_spark_submit_pod_task(task_id: str, script_name: str, extra_env: dict | None = None):
        env_vars = {
            "MINIO_ENDPOINT": CONFIG["minio_endpoint"],
            "MINIO_ACCESS_KEY": "minioadmin",
            "MINIO_SECRET_KEY": "minioadmin",
            "PUSHGATEWAY_URL": CONFIG["pushgateway_url"],
        }
        if extra_env:
            env_vars.update(extra_env)

        runtime_deps_cmd = ""

        command = (
            runtime_deps_cmd
            + 'python3 -c "import os,boto3;'
            + f"s3=boto3.client('s3',endpoint_url=os.environ['MINIO_ENDPOINT'],aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],aws_secret_access_key=os.environ['MINIO_SECRET_KEY']);s3.download_file('spark-jobs','dags/spark_jobs/{script_name}','/tmp/{script_name}')\""
            + f" && DRIVER_HOST=$(hostname -i) && /opt/spark/bin/spark-submit --master {CONFIG['spark_master']} "
            "--conf spark.driver.host=$DRIVER_HOST "
            "--conf spark.driver.bindAddress=0.0.0.0 "
            "--conf spark.executor.instances=1 "
            "--conf spark.cores.max=1 "
            "--conf spark.executor.cores=1 "
            "--conf spark.executor.memory=512m "
            "--conf spark.driver.memory=512m "
            "--conf spark.sql.shuffle.partitions=4 "
            "--conf spark.default.parallelism=1 "
            "--conf spark.hadoop.fs.s3a.endpoint=http://minio.spark-infra.svc.cluster.local:9000 "
            "--conf spark.hadoop.fs.s3a.access.key=minioadmin "
            "--conf spark.hadoop.fs.s3a.secret.key=minioadmin "
            "--conf spark.hadoop.fs.s3a.path.style.access=true "
            "--conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem "
            "--conf spark.eventLog.enabled=true "
            "--conf spark.eventLog.dir=s3a://spark-logs/events/ "
            "--conf spark.extraListeners=org.apache.spark.openTelemetry.OpenTelemetryListener "
            "--conf spark.openTelemetry.exporter.protocol=grpc "
            f"--conf spark.openTelemetry.exporter.endpoint={CONFIG['otel_endpoint']} "
            "--conf spark.openTelemetry.resource.attributes=service.name=nyc-taxi-ml "
            f"/tmp/{script_name}"
        )

        return KubernetesPodOperator(
            task_id=task_id,
            name=f"nyc-taxi-{task_id.replace('_', '-')}",
            namespace=CONFIG["namespace"],
            image="spark-custom-ml:3.5.7",
            image_pull_policy="IfNotPresent",
            cmds=["/bin/bash", "-lc"],
            arguments=[command],
            env_vars=env_vars,
            service_account_name="spark-standalone",
            get_logs=True,
            random_name_suffix=True,
            reattach_on_restart=False,
            on_finish_action="keep_pod",
            is_delete_operator_pod=False,
            in_cluster=True,
        )


    def check_data_availability(**context):
        import boto3
        from botocore.client import Config

        s3 = boto3.client(
            "s3",
            endpoint_url=CONFIG["minio_endpoint"],
            aws_access_key_id="minioadmin",
            aws_secret_access_key="minioadmin",
            config=Config(signature_version="s3v4"),
        )
        file_count = s3.list_objects_v2(Bucket="nyc-taxi", Prefix="raw/").get("KeyCount", 0)
        if file_count < 4:
            raise ValueError(f"Insufficient data: only {file_count} files found")
        push_metric("ml_data_files_available", file_count, {"stage": "validation"})
        return {"file_count": file_count}


    def validate_models(**context):
        import json
        import pickle

        import boto3

        s3 = boto3.client(
            "s3",
            endpoint_url=CONFIG["minio_endpoint"],
            aws_access_key_id="minioadmin",
            aws_secret_access_key="minioadmin",
        )

        boroughs = ["manhattan", "brooklyn", "queens", "bronx", "staten_island"]
        passed_count = 0
        for borough in boroughs:
            try:
                metrics_key = f"taxi-predictor/v{CONFIG['model_version']}/{borough}.metrics.json"
                try:
                    data = json.loads(s3.get_object(Bucket="ml-models", Key=metrics_key)["Body"].read().decode("utf-8"))
                except Exception:
                    model = pickle.loads(
                        s3.get_object(Bucket="ml-models", Key=f"taxi-predictor/v{CONFIG['model_version']}/{borough}.pkl")[
                            "Body"
                        ].read()
                    )
                    data = {"mape_revenue": model.get("mape_revenue", 999.0), "mape_trips": model.get("mape_trips", 999.0)}

                mape_rev = float(data.get("mape_revenue", 999.0))
                mape_trips = float(data.get("mape_trips", 999.0))
                if mape_rev < CONFIG["mape_threshold"] and mape_trips < CONFIG["mape_threshold"]:
                    passed_count += 1
            except Exception as exc:
                logger.error(f"Error validating {borough}: {exc}")

        push_metric("ml_validation_models_passed", passed_count, {"stage": "validation"})
        push_metric("ml_validation_total_models", len(boroughs), {"stage": "validation"})
        if passed_count == 0:
            raise ValueError("No models passed validation")


    with DAG(
        "nyc_taxi_ml_full_pipeline",
        default_args=default_args,
        description="NYC Taxi ML Pipeline with Metrics",
        schedule_interval="0 6 * * *",
        catchup=False,
        tags=["ml", "nyc-taxi", "production"],
        max_active_runs=1,
    ) as dag:
        check_data = PythonOperator(task_id="check_data_availability", python_callable=check_data_availability)

        feature_prep = build_spark_submit_pod_task(task_id="feature_engineering", script_name="taxi_feature_engineering.py")

        train_models = build_spark_submit_pod_task(task_id="train_models", script_name="taxi_catboost_training.py")

        validate = PythonOperator(task_id="validate_models", python_callable=validate_models)

        predict = build_spark_submit_pod_task(
            task_id="generate_predictions",
            script_name="taxi_predict.py",
            extra_env={"MODEL_VERSION": CONFIG["model_version"]},
        )

        check_data >> feature_prep >> train_models >> validate >> predict

  spark_standalone_load_demo.py: |
    """Airflow DAG for Spark Standalone load demo via KubernetesPodOperator."""

    from datetime import datetime

    from airflow import DAG
    from airflow.providers.cncf.kubernetes.operators.pod import KubernetesPodOperator

    with DAG(
        dag_id="spark_standalone_load_demo",
        start_date=datetime(2024, 1, 1),
        schedule_interval=None,
        catchup=False,
        tags=["spark", "standalone", "load", "demo"],
    ) as dag:
        run_spark_demo_pipeline = KubernetesPodOperator(
            task_id="run_spark_demo_pipeline",
            name="spark-standalone-load-demo",
            namespace="spark-infra",
            image="spark-custom:3.5.7",
            image_pull_policy="IfNotPresent",
            cmds=["/bin/bash", "-lc"],
            arguments=[
                (
                    "cat > /tmp/airflow_demo_pipeline.py <<'PYEOF'\n"
                    "from datetime import datetime\n"
                    "from pyspark.sql import SparkSession\n"
                    "from pyspark.sql.functions import col\n"
                    "\n"
                    "run_id = datetime.utcnow().strftime('%Y%m%d%H%M%S')\n"
                    "\n"
                    "spark = (SparkSession.builder\n"
                    "    .appName('airflow-demo-pipeline')\n"
                    "    .enableHiveSupport()\n"
                    "    .getOrCreate())\n"
                    "\n"
                    "df = spark.range(200000).withColumn('bucket', col('id') % 20)\n"
                    "output_path = f's3a://spark-jobs/airflow-demo/{run_id}/'\n"
                    "df.write.mode('overwrite').parquet(output_path)\n"
                    "\n"
                    "agg = df.groupBy('bucket').count()\n"
                    "agg.createOrReplaceTempView('agg')\n"
                    "\n"
                    "spark.sql(\"CREATE DATABASE IF NOT EXISTS demo_shared LOCATION 's3a://warehouse/spark-35/demo_shared.db'\")\n"
                    "spark.sql('DROP TABLE IF EXISTS demo_shared.airflow_demo_metrics')\n"
                    "spark.sql(\"CREATE TABLE demo_shared.airflow_demo_metrics USING PARQUET LOCATION 's3a://warehouse/spark-35/demo_shared.db/airflow_demo_metrics' AS SELECT * FROM agg\")\n"
                    "rows = spark.sql('SELECT count(*) AS c FROM demo_shared.airflow_demo_metrics').collect()[0]['c']\n"
                    "\n"
                    "print(f'DEMO_PIPELINE_OK rows={rows} output={output_path}')\n"
                    "spark.stop()\n"
                    "PYEOF\n"
                    "DRIVER_HOST=$(hostname -i) && "
                    "/opt/spark/bin/spark-submit "
                    "--master spark://spark-infra-spark-standalone-master:7077 "
                    "--conf spark.app.name=airflow-demo-pipeline "
                    "--conf spark.driver.host=$DRIVER_HOST "
                    "--conf spark.driver.bindAddress=0.0.0.0 "
                    "--conf spark.executor.cores=1 "
                    "--conf spark.executor.memory=512m "
                    "--conf spark.driver.memory=512m "
                    "--conf spark.sql.shuffle.partitions=8 "
                    "--conf spark.sql.legacy.allowNonEmptyLocationInCTAS=true "
                    "--conf spark.eventLog.enabled=true "
                    "--conf spark.eventLog.dir=s3a://spark-logs/events "
                    "--conf spark.hadoop.fs.s3a.endpoint=http://minio.spark-infra.svc.cluster.local:9000 "
                    "--conf spark.hadoop.fs.s3a.access.key=minioadmin "
                    "--conf spark.hadoop.fs.s3a.secret.key=minioadmin "
                    "--conf spark.hadoop.fs.s3a.path.style.access=true "
                    "--conf spark.hadoop.fs.s3a.connection.ssl.enabled=false "
                    "--conf spark.hadoop.hive.metastore.uris=thrift://spark-infra-spark-35-metastore:9083 "
                    "--conf spark.sql.warehouse.dir=s3a://warehouse/spark-35 "
                    "/tmp/airflow_demo_pipeline.py"
                )
            ],
            service_account_name="spark-standalone",
            get_logs=True,
            is_delete_operator_pod=True,
            in_cluster=True,
        )

  citibike_analytics_pipeline.py: |
    """
    Citibike Analytics Pipeline - Airflow DAG
    Analyzes bike-sharing trip data from NYC Citibike.
    """

    from datetime import datetime, timedelta

    from airflow import DAG
    from airflow.operators.python import PythonOperator
    from airflow.providers.cncf.kubernetes.operators.pod import KubernetesPodOperator

    CONFIG = {
        "namespace": "spark-infra",
        "spark_master": "spark://spark-infra-spark-standalone-master:7077",
        "minio_endpoint": "http://minio.spark-infra.svc.cluster.local:9000",
        "pushgateway_url": "http://prometheus.observability.svc.cluster.local:9090",
    }

    default_args = {
        "owner": "analytics-team",
        "depends_on_past": False,
        "start_date": datetime(2026, 2, 1),
        "retries": 2,
        "retry_delay": timedelta(minutes=5),
    }


    def build_spark_submit_task(task_id: str, script_name: str, extra_env: dict | None = None):
        """Create a KubernetesPodOperator task that runs a Spark job."""
        env_vars = {
            "MINIO_ENDPOINT": CONFIG["minio_endpoint"],
            "MINIO_ACCESS_KEY": "minioadmin",
            "MINIO_SECRET_KEY": "minioadmin",
            "PUSHGATEWAY_URL": CONFIG["pushgateway_url"],
        }
        if extra_env:
            env_vars.update(extra_env)

        runtime_deps_cmd = "pip install -q boto3 && "

        command = (
            runtime_deps_cmd
            + 'python3 -c "import os,boto3;'
            + f"s3=boto3.client('s3',endpoint_url=os.environ['MINIO_ENDPOINT'],aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],aws_secret_access_key=os.environ['MINIO_SECRET_KEY']);s3.download_file('spark-jobs','dags/spark_jobs/{script_name}','/tmp/{script_name}')\""
            + f" && DRIVER_HOST=$(hostname -i) && /opt/spark/bin/spark-submit --master {CONFIG['spark_master']} "
            "--conf spark.driver.host=$DRIVER_HOST "
            "--conf spark.driver.bindAddress=0.0.0.0 "
            "--conf spark.executor.instances=1 "
            "--conf spark.cores.max=1 "
            "--conf spark.executor.cores=1 "
            "--conf spark.executor.memory=1g "
            "--conf spark.driver.memory=1g "
            "--conf spark.sql.shuffle.partitions=8 "
            "--conf spark.default.parallelism=2 "
            "--conf spark.eventLog.enabled=true "
            "--conf spark.eventLog.dir=s3a://spark-logs/events/ "
            "--conf spark.hadoop.fs.s3a.endpoint=http://minio.spark-infra.svc.cluster.local:9000 "
            "--conf spark.hadoop.fs.s3a.access.key=minioadmin "
            "--conf spark.hadoop.fs.s3a.secret.key=minioadmin "
            "--conf spark.hadoop.fs.s3a.path.style.access=true "
            "--conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem "
            f"/tmp/{script_name}"
        )

        return KubernetesPodOperator(
            task_id=task_id,
            name=f"citibike-{task_id.replace('_', '-')}",
            namespace=CONFIG["namespace"],
            image="spark-custom-ml:3.5.7",
            image_pull_policy="IfNotPresent",
            cmds=["/bin/bash", "-lc"],
            arguments=[command],
            env_vars=env_vars,
            service_account_name="spark-standalone",
            get_logs=True,
            random_name_suffix=True,
            reattach_on_restart=False,
            on_finish_action="keep_pod",
            is_delete_operator_pod=False,
            in_cluster=True,
        )


    def check_data_availability(**context):
        """Check if Citibike data exists in MinIO."""
        import boto3
        from botocore.client import Config

        s3 = boto3.client(
            "s3",
            endpoint_url=CONFIG["minio_endpoint"],
            aws_access_key_id="minioadmin",
            aws_secret_access_key="minioadmin",
            config=Config(signature_version="s3v4"),
        )

        # Check for citibike bucket or create sample data
        try:
            buckets = [b["Name"] for b in s3.list_buckets()["Buckets"]]
            if "citibike" not in buckets:
                s3.create_bucket(Bucket="citibike")
                # Create sample data marker
                s3.put_object(Bucket="citibike", Key="raw/.initialized", Body=b"")
        except Exception as e:
            print(f"Bucket check/creation: {e}")

        return {"status": "ready"}


    with DAG(
        "citibike_analytics_pipeline",
        default_args=default_args,
        description="Citibike Trip Analytics Pipeline",
        schedule_interval="0 8 * * *",
        catchup=False,
        tags=["analytics", "citibike", "transportation"],
        max_active_runs=1,
    ) as dag:
        check_data = PythonOperator(task_id="check_data_availability", python_callable=check_data_availability)

        feature_prep = build_spark_submit_task(task_id="feature_engineering", script_name="citibike_feature_engineering.py")

        generate_stats = build_spark_submit_task(task_id="generate_statistics", script_name="citibike_statistics.py")

        check_data >> feature_prep >> generate_stats

