      containers:
        - name: hive-metastore
          image: "spark-k8s/hive:3.1.3-pg"
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_DRIVER
              value: "postgres"
            - name: SERVICE_NAME
              value: "metastore"
            - name: POSTGRES_HOST
              value: "postgresql-metastore-35"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "metastore_spark35"
            - name: HIVE_CONF_DIR
              value: "/tmp/hive-conf"
          envFrom:
            - secretRef:
                name: test036-hive-metastore-db
          command:
            - /bin/bash
            - -lc
            - |
              cat /opt/hive/conf/hive-site.xml.template | \
              sed "s/\${POSTGRES_HOST}/${POSTGRES_HOST}/g" | \
              sed "s/\${POSTGRES_PORT}/${POSTGRES_PORT}/g" | \
              sed "s/\${POSTGRES_DB}/${POSTGRES_DB}/g" | \
              sed "s/\${POSTGRES_USER}/${POSTGRES_USER}/g" | \
              sed "s#\${POSTGRES_PASSWORD}#${POSTGRES_PASSWORD}#g" \
              > /tmp/hive-conf/hive-site.xml
              exec /opt/hive/bin/hive --service metastore
          ports:
            - name: thrift
              containerPort: 9083
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml.template
              subPath: hive-site.xml.template
            - name: tmp
              mountPath: /tmp
            - name: hive-conf
              mountPath: /tmp/hive-conf
      volumes:
        - name: hive-config
          configMap:
            name: test036-hive-metastore-config
        - name: tmp
          emptyDir: {}
        - name: hive-conf
          emptyDir: {}
