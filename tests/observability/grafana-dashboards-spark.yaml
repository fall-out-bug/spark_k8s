      "schemaVersion": 38,
      "style": "dark",
      "tags": ["spark", "cluster"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "Spark Cluster",
      "uid": "spark-cluster",
      "version": 1
    }
