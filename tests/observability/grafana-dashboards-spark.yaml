          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 4096, "min": 0, "mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 3000}, {"color": "red", "value": 3800}]}, "unit": "decmbytes"}, "overrides": []},
