apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-demo-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: demo-metrics-exporter
        static_configs:
          - targets: ["demo-metrics-exporter.observability.svc.cluster.local:9108"]

      - job_name: spark-master
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [spark-infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: spark-infra-spark-standalone-master
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - source_labels: [__address__]
            target_label: __address__
            replacement: spark-infra-spark-standalone-master.spark-infra.svc.cluster.local:8080
          - target_label: job
            replacement: spark-master

      - job_name: spark-worker
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [spark-infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: spark-worker
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:8081
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: job
            replacement: spark-worker

      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.observability.svc.cluster.local:8889"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-demo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
