# Demo values for spark-3.5 chart.
# S3/PG credentials are NOT hardcoded — reference a pre-created Secret.
# Create it before deploying:
#   kubectl create secret generic spark-s3-creds --from-literal=access-key="$S3_ACCESS_KEY" --from-literal=secret-key="$S3_SECRET_KEY"
#   kubectl create secret generic spark-pg-creds --from-literal=password="$POSTGRESQL_PASSWORD"
global:
  s3:
    enabled: true
    endpoint: "http://minio:9000"
    accessKey: ""  # leave empty when using existingSecret
    secretKey: ""  # leave empty when using existingSecret
    existingSecret: "spark-s3-creds"  # Secret with keys: access-key, secret-key
    existingSecretAccessKey: "access-key"
    existingSecretSecretKey: "secret-key"
    pathStyleAccess: true
    sslEnabled: false
  postgresql:
    host: "spark-demo-spark-base-postgresql"
    port: 5432
    user: "spark"
    password: ""  # leave empty when using existingSecret
    existingSecret: "spark-pg-creds"  # Secret with key: password
    existingSecretPasswordKey: "password"

security:
  podSecurityStandards: false

spark-base:
  enabled: true
  s3:
    accessKey: ""  # leave empty when using existingSecret
    secretKey: ""  # leave empty when using existingSecret
    existingSecret: "spark-s3-creds"  # same Secret as global.s3.existingSecret
    existingSecretAccessKey: "access-key"
    existingSecretSecretKey: "secret-key"
  minio:
    enabled: true
    persistence:
      enabled: true
      size: "10Gi"
  postgresql:
    enabled: true
    auth:
      username: "spark"
      password: ""  # leave empty; secret referenced below
      existingSecret: "spark-pg-creds"  # Secret with key: password
    databases:
      - "metastore_spark35"
    authMethod: "md5"
    persistence:
      enabled: true
      size: "8Gi"

hiveMetastore:
  enabled: true
  image:
    repository: "spark-k8s/hive"
    tag: "4.0.0-pg"
  database:
    name: "metastore_spark35"
  warehouseDir: "s3a://warehouse/spark-35"

historyServer:
  enabled: true
  image:
    repository: "spark-custom"
    tag: "3.5.7"
  logDirectory: "s3a://spark-logs/events"

standalone:
  enabled: true
  image:
    repository: "spark-custom"
    tag: "3.5.7"
  worker:
    replicas: 1

connect:
  enabled: false
jupyter:
  enabled: false
airflow:
  enabled: false
