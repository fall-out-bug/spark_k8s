# Build Spark distributions once, save as artifacts. Docker builds use these instead of compiling at runtime.
# Trigger: manual or when docker/spark-custom/ changes

name: "Build Spark Distributions"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Spark version"
        required: true
        default: "3.5.7"
        type: choice
        options:
          - "3.5.7"
          - "3.5.8"
          - "4.1.0"
          - "4.1.1"

env:
  HADOOP_VERSION: "3.4.2"
  MAVEN_OPTS: "-Xmx4g -Dmaven.wagon.http.retryHandler.count=5"

jobs:
  build:
    name: Build Spark ${{ github.event.inputs.version || '3.5.7' }}
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install deps — user-space, no sudo
        run: |
          # Self-hosted runner may lack passwordless sudo. Tarballs -> $HOME/.local.
          mkdir -p "$HOME/.local"
          # JDK: install BOTH 17 (default, Spark 4.x) and 11 (Spark 3.5.x source-build
          # — JDK 17 removed sun.security.action which Spark 3.5 source references).
          # Spark 3.5.x build fails on JDK 17 with:
          #   "object action is not a member of package sun.security"
          if ! command -v javac >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y openjdk-17-jdk || \
              echo "::warning::apt-get needs sudo; assuming JDK 17 pre-installed on runner"
          fi
          # JDK 11 for Spark 3.5.x source builds (best-effort if sudo available)
          sudo apt-get install -y openjdk-11-jdk 2>/dev/null || \
            echo "::warning::JDK 11 not installed (sudo unavailable). Spark 3.5.x source-build may fail."
          # Set JAVA_HOME per Spark version later (in build step)
          echo "JAVA_HOME_17=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "JAVA_HOME_11=/usr/lib/jvm/java-11-openjdk-amd64" >> "$GITHUB_ENV"
          # Maven (tarball -> user-space)
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/apache-maven-3.9.6/bin" >> "$GITHUB_PATH"
          echo "MAVEN_HOME=$HOME/.local/apache-maven-3.9.6" >> "$GITHUB_ENV"
          # Scala 2.12 + 2.13 (Spark 3.x uses 2.12, Spark 4.x uses 2.13)
          wget -q https://downloads.lightbend.com/scala/2.12.19/scala-2.12.19.tgz
          tar -xzf scala-2.12.19.tgz -C "$HOME/.local"
          wget -q https://downloads.lightbend.com/scala/2.13.14/scala-2.13.14.tgz
          tar -xzf scala-2.13.14.tgz -C "$HOME/.local"
          echo "$HOME/.local/scala-2.12.19/bin:$HOME/.local/scala-2.13.14/bin" >> "$GITHUB_PATH"

      - name: Build Spark distribution
        run: |
          SPARK_VERSION="${{ github.event.inputs.version || '3.5.7' }}"
          # Maven + Scala already on PATH via GITHUB_PATH (user-space install).
          # JDK selection: Spark 3.5.x source-build requires JDK 11 (JDK 17 removed
          # sun.security.action internal package that Spark 3.5 references).
          # Spark 4.x builds on JDK 17.
          if [[ "$SPARK_VERSION" == 3.5.* ]] && [[ -d "$JAVA_HOME_11" ]]; then
            export JAVA_HOME="$JAVA_HOME_11"
            echo "Using JDK 11 for Spark 3.5.x source build: $JAVA_HOME"
          elif [[ -d "$JAVA_HOME_17" ]]; then
            export JAVA_HOME="$JAVA_HOME_17"
            echo "Using JDK 17 for Spark $SPARK_VERSION: $JAVA_HOME"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          mkdir -p dist/build
          cd dist/build

          git clone --branch "v${SPARK_VERSION}" --depth 1 https://github.com/apache/spark.git "spark-${SPARK_VERSION}"
          cd "spark-${SPARK_VERSION}"

          ./dev/make-distribution.sh \
            --name "custom-hadoop-${HADOOP_VERSION}" \
            --tgz \
            -Dhadoop.version="${HADOOP_VERSION}" \
            -Phadoop-3 \
            -Pkubernetes \
            -Phadoop-cloud \
            -Phive-thriftserver \
            -Pconnect \
            -DskipTests

          TGZ="spark-${SPARK_VERSION}-bin-custom-hadoop-${HADOOP_VERSION}.tgz"
          mv "$TGZ" ../../../
          cd ../../..
          mkdir -p dist
          mv "$TGZ" dist/
          ls -lh dist/"$TGZ"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-dist-${{ github.event.inputs.version || '3.5.7' }}
          path: dist/
          retention-days: 90

      - name: Output
        run: |
          V="${{ github.event.inputs.version || '3.5.7' }}"
          echo "Built dist/spark-${V}-bin-custom-hadoop-${HADOOP_VERSION}.tgz"
