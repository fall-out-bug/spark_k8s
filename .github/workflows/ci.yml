name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Helm lint spark-3.5
        run: helm lint charts/spark-3.5

      - name: Helm lint spark-4.1
        run: helm lint charts/spark-4.1

      - name: ShellCheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep '^scripts/.*\.sh$' > changed-shell.txt || true
            if [ ! -s changed-shell.txt ]; then
              echo "No changed shell scripts"
              exit 0
            fi
          else
            find scripts -name "*.sh" > changed-shell.txt
          fi
          sudo apt-get install -y shellcheck
          xargs -r shellcheck -S warning < changed-shell.txt

  template-tests:
    name: Helm Template Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Run template tests
        run: pytest tests/ -v --tb=short -m "not e2e and not slow"
