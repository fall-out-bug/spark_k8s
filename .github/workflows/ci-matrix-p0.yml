name: "CI Matrix: P0 Smoke (manual — runner not implemented)"

on:
  workflow_dispatch:
  # NOTE: pull_request trigger removed 2026-08-09. The P0 smoke runner
  # (scripts/run-matrix-p0.sh, filtering smoke-matrix.yaml priority_tiers.p0_pr)
  # is not implemented, so this workflow previously gated NOTHING on PRs while
  # echoing "8 scenarios" as if they ran. Re-add `pull_request:` once the runner
  # exists.

concurrency:
  group: matrix-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-smoke:
    name: P0 Smoke (manual; runner pending)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Minikube
        run: |
          # TODO: replace with composite action when minikube-setup action is standardized
          minikube start --cpus=6 --memory=16g --disk-size=50g
      - name: Build required images
        run: |
          eval "$(minikube docker-env)"
          # Skip if images already present
          docker image inspect spark-custom:3.5.7 >/dev/null 2>&1 || \
            docker build -f docker/spark-custom/Dockerfile.3.5.7 -t spark-custom:3.5.7 docker/spark-custom
          docker image inspect spark-k8s/hive:3.1.3-pg >/dev/null 2>&1 || \
            docker build -f docker/hive/Dockerfile --build-arg HIVE_VERSION=3.1.3 -t spark-k8s/hive:3.1.3-pg docker/hive
      - name: Deploy demo (shared infra + standalone + airflow + jupyter)
        run: ./scripts/deploy-demo-minikube.sh
      - name: Validate matrix yaml
        run: python3 scripts/tests/smoke/matrix/validate-smoke-matrix.py
      - name: Run P0 smoke tier
        run: |
          echo "NOT IMPLEMENTED: scripts/run-matrix-p0.sh does not exist."
          echo "8 P0 scenarios are defined in tests/smoke-matrix.yaml (priority_tiers.p0_pr)"
          echo "but not wired to a runner. Implement the runner, then re-add the pull_request trigger."
      - name: Check demo health
        run: ./scripts/check-demo-health.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-p0-results
          path: tests/results/
          retention-days: 7
