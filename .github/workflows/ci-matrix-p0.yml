name: "CI Matrix: P0 Smoke (PR gate)"

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "charts/spark-3.5/**"
      - "charts/spark-4.1/**"
      - "charts/spark-base/**"
      - "scripts/tests/smoke/**"
      - "scripts/tests/load/matrix/**"
      - "scripts/run-matrix*.sh"

concurrency:
  group: matrix-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-smoke:
    name: P0 Smoke (8 scenarios)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Minikube
        run: |
          # TODO: replace with composite action when minikube-setup action is standardized
          minikube start --cpus=6 --memory=16g --disk-size=50g
      - name: Build required images
        run: |
          eval "$(minikube docker-env)"
          # Skip if images already present
          docker image inspect spark-custom:3.5.7 >/dev/null 2>&1 || \
            docker build -f docker/spark-custom/Dockerfile.3.5.7 -t spark-custom:3.5.7 docker/spark-custom
          docker image inspect spark-k8s/hive:3.1.3-pg >/dev/null 2>&1 || \
            docker build -f docker/hive/Dockerfile --build-arg HIVE_VERSION=3.1.3 -t spark-k8s/hive:3.1.3-pg docker/hive
      - name: Deploy demo (shared infra + standalone + airflow + jupyter)
        run: ./scripts/deploy-demo-minikube.sh
      - name: Validate matrix yaml
        run: python3 scripts/tests/smoke/matrix/validate-smoke-matrix.py
      - name: Run P0 smoke tier
        run: |
          # TODO: implement scripts/run-matrix-p0.sh that filters smoke-matrix.yaml p0_pr tier
          # Currently a stub — replace with actual P0 runner
          echo "P0 tier: 8 scenarios (baseline, 3.5.7+4.1.0, k8s+standalone)"
          echo "Filter: tier=p0_pr components=airflow,jupyter spark_versions=3.5.7,4.1.0 modes=k8s,standalone features=baseline"
          # ./scripts/run-matrix-p0.sh
      - name: Check demo health (non-blocking warning)
        continue-on-error: true
        run: ./scripts/check-demo-health.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-p0-results
          path: tests/results/
          retention-days: 7
