name: "CI Matrix: P2 Weekly (full 144)"

on:
  schedule:
    - cron: "23 5 * * 1"  # 05:23 UTC every Monday
  workflow_dispatch:

jobs:
  p2-weekly:
    name: P2 Weekly (144 scenarios, full matrix incl. connect)
    runs-on: self-hosted
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - name: Setup Minikube (large)
        run: |
          # P2 weekly needs the largest cluster
          minikube start --cpus=8 --memory=24g --disk-size=80g
      - name: Validate matrix yaml
        run: python3 scripts/tests/smoke/matrix/validate-smoke-matrix.py
      - name: Run P2 full tier
        run: |
          # No dedicated tier script yet: run-matrix.sh without a filter covers
          # all 320 scenarios (superset of the planned p2_weekly tier).
          ./scripts/run-matrix.sh all
      - name: Check demo health (post-run)
        if: always()
        run: ./scripts/check-demo-health.sh || ./scripts/restore-demo.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-p2-results
          path: tests/results/
          retention-days: 90
      - name: Generate report
        if: always()
        run: |
          mkdir -p docs/reports
          # empty filter => aggregate every scenario, not just the k8s 96-cell subset
          python3 scripts/aggregate-matrix-results.py \
            --results-dir tests/results \
            --filter "" \
            --output docs/reports/matrix-p2-weekly-$(date +%Y-%m-%d).md
