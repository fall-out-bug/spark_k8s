# GitHub labels - apply via: gh label create <name> --color <hex>
# Or use GitHub UI: Settings → Labels
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: documentation
  color: 0075ca
  description: Documentation improvements
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is needed
- name: spark-3.5
  color: f9d0c4
  description: Spark 3.5.x
- name: spark-4.1
  color: f9d0c4
  description: Spark 4.1.x
- name: kubernetes
  color: 326ce5
  description: Kubernetes related
- name: openshift
  color: ee0000
  description: OpenShift related
