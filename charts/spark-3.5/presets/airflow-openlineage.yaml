# Spark-3.5 preset: Airflow OpenLineage integration
# Enables airflow + standalone + adds spark_openlineage_demo DAG
# Requires: charts/openlineage/ deployed in lineage namespace
# Usage: helm install spark-infra charts/spark-3.5 -n spark-infra \
#   -f presets/airflow-openlineage.yaml \
#   --set global.s3.accessKey=<KEY> --set global.s3.secretKey=<SECRET>

global:
  s3:
    endpoint: "http://minio.spark-infra.svc.cluster.local:9000"
    accessKey: ""  # REQUIRED: set via --set or ExternalSecrets
    secretKey: ""  # REQUIRED: set via --set or ExternalSecrets
    pathStyleAccess: true
    sslEnabled: false
  postgresql:
    host: "spark-infra-spark-base-postgresql.spark-infra.svc.cluster.local"
    port: 5432
    user: "postgres"
    password: "postgres"

spark-base:
  enabled: true  # Required: spark-base templates provide podSecurityContext helper
  minio:
    enabled: true
  postgresql:
    enabled: true
    auth:
      username: "postgres"
      password: "postgres"
    databases:
      - "airflow"
      - "spark_db"
    authMethod: "md5"

standalone:
  enabled: true
  master: { replicas: 1 }
  worker: { replicas: 2 }

connect:
  enabled: false

jupyter:
  enabled: false

airflow:
  enabled: true
  image:
    repository: spark-k8s/airflow
    tag: "3.2.2"
    pullPolicy: IfNotPresent
  postgresql:
    enabled: false
    externalHost: "spark-infra-spark-base-postgresql.spark-infra.svc.cluster.local"
    externalPort: 5432
    auth: { database: "airflow", username: "postgres", password: "postgres" }
  env:
    OPENLINEAGE_TRANSPORT: '{"type":"http","url":"http://openlineage-marquez.lineage.svc.cluster.local:5000","endpoint":"/api/v1/lineage","timeout":30}'
    OPENLINEAGE_NAMESPACE: spark-infra-airflow
  dags:
    - spark_openlineage_demo.py
    - spark_standalone_load_demo.py

historyServer:
  enabled: true
