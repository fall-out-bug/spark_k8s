# Spark-3.5 preset: Airflow OpenLineage integration
# Enables airflow + standalone + adds spark_openlineage_demo DAG
# Requires: charts/openlineage/ deployed in lineage namespace
# Usage: helm install spark-infra charts/spark-3.5 -n spark-infra \
#   -f presets/airflow-openlineage.yaml \
#   --set global.s3.accessKey=minioadmin --set global.s3.secretKey=minioadmin

global:
  s3:
    endpoint: "http://minio.spark-infra.svc.cluster.local:9000"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    pathStyleAccess: true
    sslEnabled: false

spark-base:
  enabled: false  # Assumes shared-infra already deployed

standalone:
  enabled: true
  master: { replicas: 1 }
  worker: { replicas: 2 }

connect:
  enabled: false

jupyter:
  enabled: false

airflow:
  enabled: true
  image:
    repository: spark-k8s/airflow
    tag: "2.11.0"
    pullPolicy: IfNotPresent
  env:
    OPENLINEAGE_TRANSPORT: '{"type":"http","url":"http://openlineage-marquez.lineage.svc.cluster.local:5000","endpoint":"/api/v1/lineage","timeout":30}'
    OPENLINEAGE_NAMESPACE: spark-infra-airflow
  dags:
    - spark_openlineage_demo.py
    - spark_standalone_load_demo.py

historyServer:
  enabled: true
