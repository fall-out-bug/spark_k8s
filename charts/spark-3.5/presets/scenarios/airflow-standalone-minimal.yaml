# Scenario Preset: Airflow + Spark Standalone (Minimal Resources)
#
# Standalone cluster + Airflow orchestration in one release
# Airflow is now a top-level component (independent of standalone)

# Core Infrastructure (minimal - Airflow manages storage)
spark-base:
  enabled: true
  minio:
    enabled: false
  postgresql:
    enabled: false

# RBAC for Spark pods
rbac:
  create: true
  serviceAccountName: "spark"

# Spark Standalone Cluster
standalone:
  enabled: true
  serviceAccount:
    create: true
    name: "spark-standalone"
  rbac:
    create: true
  image:
    repository: spark-custom
    tag: "3.5.7"
    pullPolicy: IfNotPresent
  master:
    service:
      type: ClusterIP
      rpcPort: 7077
      uiPort: 8080
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  worker:
    enabled: true
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    sparkConf:
      spark.worker.memory: "512m"
      spark.worker.cores: "1"

# Airflow Orchestration (top-level, independent of standalone)
airflow:
  enabled: true
  image:
    repository: spark-k8s/airflow
    tag: "3.2.2"
    pullPolicy: IfNotPresent
  webserver:
    replicas: 1
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  scheduler:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  postgresql:
    enabled: true
    auth:
      database: "airflow"
      username: "airflow"
      password: ""
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    persistence:
      enabled: false

# Disable Spark Connect (not needed for direct spark-submit)
connect:
  enabled: false

# Disable Jupyter (not needed for Airflow scenario)
jupyter:
  enabled: false

# Disable other components
hiveMetastore:
  enabled: false

historyServer:
  enabled: false

ingress:
  enabled: false

security:
  podSecurityStandards: false
