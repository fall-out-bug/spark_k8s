# Core Baseline Preset for Spark 3.5
#
# This preset enables all core infrastructure components for a minimal Lakehouse stack:
# - MinIO: S3-compatible object storage
# - PostgreSQL: Relational database for metastore
# - Hive Metastore: Metadata catalog for Spark SQL
# - History Server: UI for completed Spark applications
#
# Features:
# - GPU: disabled
# - Iceberg: disabled
#
# Usage:
#   helm install my-spark charts/spark-3.5 -f charts/spark-3.5/presets/core-baseline.yaml \
#     --set global.s3.accessKey=... --set global.s3.secretKey=... \
#     --set spark-base.postgresql.auth.password=... \
#     --set global.postgresql.host=my-spark-spark-base-postgresql
#
# The last --set is required because the subchart PostgreSQL service name is
# always "<release>-spark-base-postgresql" and cannot be renamed.

# Global S3 configuration (used by History Server and Hive Metastore)
global:
  s3:
    enabled: true
    endpoint: "http://minio-spark-35:9000"
    pathStyleAccess: true
    sslEnabled: false
    existingSecret: "s3-credentials"

# Core Infrastructure Components (using top-level values for Spark 3.5)
# MinIO is deployed by this chart itself (gated by core.minio.enabled).
core:
  minio:
    enabled: true
    fullnameOverride: "minio-spark-35"

# PostgreSQL for the metastore is provided exclusively by the spark-base
# subchart; there is no chart-local postgres deployer.
spark-base:
  postgresql:
    enabled: true
    # Password intentionally empty here: REQUIRED via --set or ExternalSecrets
    # (constitution §IV). Example:
    #   --set spark-base.postgresql.auth.password=...
    auth:
      username: hive
      password: ""
  # The subchart mirrors the parent "core" defaults through spark-base.core;
  # silence those embedded copies so every component deploys exactly once
  # (same technique shared-infra runs use).
  core:
    minio:
      enabled: false
    postgresql:
      enabled: false
    hiveMetastore:
      enabled: false
    historyServer:
      enabled: false

hiveMetastore:
  enabled: true
  fullnameOverride: "hive-metastore-35"

historyServer:
  enabled: true
  fullnameOverride: "history-server-35"
  logDirectory: "s3a://spark-logs/events"

# Feature flags
features:
  iceberg:
    enabled: false
  gpu:
    enabled: false

# Optional components (disabled for baseline)
connect:
  enabled: false

jupyter:
  enabled: false

airflow:
  enabled: false
