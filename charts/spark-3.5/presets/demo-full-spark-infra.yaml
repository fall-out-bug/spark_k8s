# Demo: Full Spark Infra in spark-infra namespace
# MinIO + Metastore + History + Standalone + Airflow + Jupyter
# Usage: helm install spark-infra charts/spark-3.5 -n spark-infra -f charts/spark-3.5/presets/demo-full-spark-infra.yaml
#        --set global.s3.accessKey=minioadmin --set global.s3.secretKey=minioadmin
#        --set spark-base.postgresql.auth.password=postgres
#        --set standalone.airflow.postgresql.auth.password=airflow
#
# Resource budget (minikube 6 CPU / 48Gi):
#   System (kube-system, sdp, kubeopencode): ~850m / 300Mi
#   Observability (prometheus, grafana, loki): ~250m / 544Mi
#   spark-infra infrastructure: ~1750m / 4Gi
#   spark-infra workers: 3 × 800m / 8Gi = 2400m / 24Gi
#   TOTAL requests: ~5250m (87%) / ~29Gi (60%)
#   Free headroom: ~750m CPU, ~19Gi memory

global:
  s3:
    endpoint: "http://minio.spark-infra.svc.cluster.local:9000"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    pathStyleAccess: true
    sslEnabled: false
  postgresql:
    host: "spark-infra-spark-base-postgresql.spark-infra.svc.cluster.local"
    port: 5432
    user: "postgres"
    password: "postgres"

# --- Shared infrastructure ---

spark-base:
  enabled: true
  minio:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    persistence:
      enabled: true
      size: "10Gi"
    buckets:
      - warehouse
      - spark-logs
      - spark-jobs
      - raw-data
      - processed-data
  postgresql:
    enabled: true
    auth:
      username: "postgres"
      password: "postgres"
    databases:
      - "spark_db"
    authMethod: "md5"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    persistence:
      enabled: true
      size: "5Gi"

# --- Spark Standalone cluster ---

standalone:
  enabled: true
  master:
    enabled: true
    image:
      repository: spark-custom
      tag: "3.5.7"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "300m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
  worker:
    enabled: true
    replicas: 3
    image:
      repository: spark-custom
      tag: "3.5.7"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "800m"
        memory: "8Gi"
      limits:
        cpu: "2"
        memory: "14Gi"
    sparkConf:
      spark.worker.memory: "12g"
      spark.worker.cores: "2"
  airflow:
    enabled: true
    webserver:
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "2Gi"
      service:
        type: NodePort
        nodePort: 30080
    scheduler:
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "2Gi"
    postgresql:
      enabled: true
      auth:
        password: "airflow"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

connect:
  enabled: false

# --- User-facing services ---

jupyter:
  enabled: true
  image:
    repository: jupyter/all-spark-notebook
    tag: "latest"
  resources:
    requests:
      cpu: "300m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  service:
    type: NodePort
    nodePort: 30088
  demoNotebooks:
    enabled: true

historyServer:
  enabled: true
  logDirectory: "s3a://spark-logs/events"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  service:
    type: NodePort
    nodePort: 30081

hiveMetastore:
  enabled: true
  warehouseDir: "s3a://warehouse/spark-35"
  database:
    name: "spark_db"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

security:
  podSecurityStandards: false
