# Demo: Full Spark Infra in spark-infra namespace
# MinIO + Metastore + History + Standalone + Airflow + Jupyter
# Usage: helm install spark-infra charts/spark-3.5 -n spark-infra -f charts/spark-3.5/presets/demo-full-spark-infra.yaml
#        --set global.s3.accessKey=minioadmin --set global.s3.secretKey=minioadmin
#        --set spark-base.postgresql.auth.password=postgres
#        (Airflow uses shared PostgreSQL, same password)
#
# Resource budget (minikube 6 CPU / 48Gi):
#   System (kube-system, sdp, kubeopencode): ~850m / 300Mi
#   Observability (prometheus, grafana, loki): ~250m / 544Mi
#   spark-infra infrastructure: ~1550m / 4.5Gi
#   spark-infra workers: 3 × 800m / 13Gi = 2400m / 39Gi
#   TOTAL requests: ~5050m (84%) / ~44Gi (92%)
#   Free headroom: ~950m CPU, ~4Gi memory
#
# Spark memory ratio: 14g / 2 cores = 7 GB/core
# Suitable for ML workloads (CatBoost, ALS) which need 8-16 GB/core.

global:
  s3:
    endpoint: "http://minio.spark-infra.svc.cluster.local:9000"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    pathStyleAccess: true
    sslEnabled: false
  postgresql:
    host: "spark-infra-spark-base-postgresql.spark-infra.svc.cluster.local"
    port: 5432
    user: "postgres"
    password: "postgres"

# --- Shared infrastructure ---

spark-base:
  enabled: true
  minio:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    persistence:
      enabled: true
      size: "10Gi"
    buckets:
      - warehouse
      - spark-logs
      - spark-jobs
      - raw-data
      - processed-data
  postgresql:
    enabled: true
    auth:
      username: "postgres"
      password: "postgres"
    databases:
      - "spark_db"
      - "airflow"  # Shared with Airflow (single PostgreSQL instance)
    authMethod: "md5"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    persistence:
      enabled: true
      size: "5Gi"

# --- Spark Standalone cluster ---

standalone:
  enabled: true
  image:
    repository: spark-custom
    tag: "3.5.7"
    pullPolicy: IfNotPresent
  master:
    resources:
      requests:
        cpu: "300m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
  worker:
    enabled: true
    replicas: 3
    resources:
      requests:
        cpu: "800m"
        memory: "13Gi"
      limits:
        cpu: "2"
        memory: "15Gi"
    sparkConf:
      spark.worker.memory: "14g"
      spark.worker.cores: "2"
    workDir: "/tmp/spark-worker"

# --- Airflow Orchestration (independent of standalone) ---

airflow:
  enabled: true
  image:
    repository: spark-k8s/airflow
    tag: "2.11.0"
    pullPolicy: IfNotPresent
  webserver:
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    service:
      type: NodePort
      port: 8080
      nodePort: 30080
  scheduler:
    replicas: 1
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
  postgresql:
    enabled: false
    externalHost: "spark-infra-spark-base-postgresql.spark-infra.svc.cluster.local"
    externalPort: 5432
    auth:
      database: "airflow"
      username: "postgres"
      password: "postgres"
    service:
      port: 5432
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  config:
    core:
      dags_folder: "/opt/airflow/dags"
      load_examples: "False"
      executor: "LocalExecutor"
    webserver:
      expose_config: "True"
      rbac: "True"
    scheduler:
      catchup_by_default: "False"
  dags:
    - nyc_taxi_ml_full_pipeline.py
    - spark_standalone_load_demo.py
    - citibike_analytics_pipeline.py
    - movielens_recommendation_pipeline.py

connect:
  enabled: false

# --- User-facing services ---

jupyter:
  enabled: true
  image:
    repository: jupyter/all-spark-notebook
    tag: "latest"
  resources:
    requests:
      cpu: "300m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  service:
    type: NodePort
    nodePort: 30088
  demoNotebooks:
    enabled: true

historyServer:
  enabled: true
  logDirectory: "s3a://spark-logs/events"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  service:
    type: NodePort
    nodePort: 30081

hiveMetastore:
  enabled: true
  warehouseDir: "s3a://warehouse/spark-35"
  database:
    name: "spark_db"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

security:
  podSecurityStandards: false
