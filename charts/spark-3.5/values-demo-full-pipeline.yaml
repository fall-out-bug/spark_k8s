# Full Pipeline Demo Configuration
# Complete Spark + Airflow + Monitoring stack for batch ETL workloads
#
# Usage:
#   helm dependency build charts/spark-3.5
#   helm install full-demo charts/spark-3.5 -n demo --create-namespace -f charts/spark-3.5/values-demo-full-pipeline.yaml

global:
  imagePullSecrets: []
  s3:
    enabled: true
    endpoint: "http://minio:9000"
    accessKey: ""  # REQUIRED: set via --set or ExternalSecrets
    secretKey: ""  # REQUIRED: set via --set or ExternalSecrets
    pathStyleAccess: true
    sslEnabled: false

# ===========================================
# Core Infrastructure
# ===========================================

core:
  minio:
    enabled: true
    persistence:
      enabled: false
    buckets:
      - warehouse
      - spark-logs
      - spark-jobs
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "100m"

  postgresql:
    enabled: false

  hiveMetastore:
    enabled: false

spark-base:
  enabled: true

# ===========================================
# Spark Standalone Cluster (parent templates)
# ===========================================

standalone:
  enabled: true
  image:
    repository: spark-custom
    tag: "3.5.7"
    pullPolicy: IfNotPresent
  master:
    service:
      type: ClusterIP
      rpcPort: 7077
      uiPort: 8080
    resources:
      requests:
        memory: "256Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "200m"
  worker:
    enabled: true
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "50m"
      limits:
        memory: "1Gi"
        cpu: "200m"
    sparkConf:
      spark.worker.memory: "512m"
      spark.worker.cores: "1"
    workDir: "/tmp/spark-worker"

# ===========================================
# Spark Connect (Interactive Analytics)
# ===========================================

connect:
  enabled: true
  replicas: 1
  image:
    repository: spark-custom
    tag: "3.5.7"
  service:
    type: ClusterIP
    port: 15002
  backendMode: "standalone"
  standalone:
    masterService: "demo-full-standalone-master"
    masterPort: 7077
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  eventLog:
    enabled: false

# ===========================================
# Jupyter (Interactive Development)
# ===========================================

jupyter:
  enabled: true
  demoNotebooks:
    enabled: true
  image:
    repository: spark-k8s-jupyter
    tag: "3.5-3.5.7"
  service:
    type: ClusterIP
    port: 8888
  env:
    SPARK_CONNECT_URL: "sc://demo-full-spark-35-connect:15002"
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  persistence:
    enabled: false

# ===========================================
# History Server (Spark UI)
# ===========================================

historyServer:
  enabled: true
  image:
    repository: spark-custom
    tag: "3.5.7"
  logDirectory: "file:///tmp/spark-events"
  service:
    type: ClusterIP
    port: 18080
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "100m"

# ===========================================
# Monitoring (Full Observability)
# ===========================================

monitoring:
  prometheus:
    datasourceUid: "PBFA97CFB590B2093"
  serviceMonitor:
    enabled: true
    interval: "15s"
    scrapeTimeout: "10s"
  podMonitor:
    enabled: true
    interval: "30s"
  grafanaDashboards:
    enabled: true
  grafana:
    dashboards:
      enabled: true
  prometheusAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4040"
  s3aMetrics:
    enabled: true
  jobPhaseTimeline:
    enabled: true
  sparkProfiling:
    enabled: true

# ===========================================
# Security
# ===========================================

security:
  podSecurityStandards: true
  runAsUser: 185
  runAsGroup: 185
  fsGroup: 185

rbac:
  create: true
  serviceAccountName: "spark-35"
