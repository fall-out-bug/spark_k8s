{{- if .Values.core.minio.enabled }}
{{/*
Per-release lightweight MinIO (emptyDir, buckets via mkdir).
The spark-base subchart carries a fuller alternative (PVC, bucket-init Job,
s3-credentials Secret) gated by spark-base.minio.enabled — both default OFF;
enable exactly one. Shared-infra deployments disable both and point
global.s3.endpoint at an external MinIO.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spark.core.minio.fullname" . }}
  labels:
    app: minio
    {{- include "spark-3.5.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
      {{- include "spark-3.5.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: minio
        {{- include "spark-3.5.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: minio
        image: "{{ .Values.core.minio.image.repository }}:{{ .Values.core.minio.image.tag }}"
        command:
        - /bin/bash
        - -c
        - |
          mkdir -p /data/{raw-data,processed-data,checkpoint,warehouse,spark-logs,spark-jobs}
          minio server /data --console-address ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.global.s3.accessKey | required "global.s3.accessKey is REQUIRED for MinIO root user (constitution §IV)" | quote }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.global.s3.secretKey | required "global.s3.secretKey is REQUIRED for MinIO root password (constitution §IV)" | quote }}
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spark.core.minio.fullname" . }}
  labels:
    app: minio
    {{- include "spark-3.5.labels" . | nindent 4 }}
spec:
  selector:
    app: minio
    {{- include "spark-3.5.selectorLabels" . | nindent 4 }}
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
{{- end }}
