{{- if and .Values.standalone.enabled .Values.standalone.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-standalone-worker
  labels:
    app: standalone-worker
    app.kubernetes.io/component: standalone-worker
    {{- include "spark-3.5.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.standalone.worker.replicas }}
  selector:
    matchLabels:
      app: standalone-worker
      app.kubernetes.io/component: standalone-worker
  template:
    metadata:
      labels:
        app: standalone-worker
        app.kubernetes.io/component: standalone-worker
        {{- include "spark-3.5.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.standalone.serviceAccountName | default (include "spark-3.5.serviceAccountName" .) }}
      {{- if .Values.security.podSecurityStandards }}
      securityContext:
        {{- include "spark-base.podSecurityContext" . | nindent 8 }}
      {{- end }}
      {{- with .Values.standalone.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.standalone.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: spark-logs
          emptyDir: {}
        - name: spark-work
          emptyDir: {}
      containers:
        - name: spark-worker
          image: "{{ .Values.standalone.image.repository }}:{{ .Values.standalone.image.tag }}"
          imagePullPolicy: {{ .Values.standalone.image.pullPolicy }}
          command: ["/opt/spark/sbin/start-worker.sh"]
          args: ["spark://{{ .Release.Name }}-standalone-master:{{ .Values.standalone.master.service.rpcPort }}"]
          env:
            - name: SPARK_MODE
              value: "worker"
            - name: SPARK_MASTER_HOST
              value: {{ .Release.Name }}-standalone-master
            - name: SPARK_MASTER_PORT
              value: {{ .Values.standalone.master.service.rpcPort | quote }}
            {{- if .Values.global.s3.enabled }}
            {{- if .Values.global.s3.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.s3.existingSecret }}
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.s3.existingSecret }}
                  key: secret-key
            {{- else }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.global.s3.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.global.s3.secretKey | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $val := .Values.standalone.worker.sparkConf }}
            - name: SPARK_{{ $key | replace "." "_" | upper }}
              value: {{ $val | quote }}
            {{- end }}
          {{- if .Values.security.podSecurityStandards }}
          securityContext:
            {{- include "spark-base.containerSecurityContext" . | nindent 12 }}
          {{- end }}
          ports:
            - name: rpc
              containerPort: {{ .Values.standalone.master.service.rpcPort }}
              protocol: TCP
            - name: ui
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: spark-logs
              mountPath: /opt/spark/logs
            - name: spark-work
              mountPath: /opt/spark/work
          resources:
            {{- toYaml .Values.standalone.worker.resources | nindent 12 }}
{{- end }}
