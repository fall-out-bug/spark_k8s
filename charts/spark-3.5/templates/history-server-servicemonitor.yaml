{{/*
ServiceMonitor for Spark History Server (WS-016-06)
AC1: Prometheus scrapes History Server metrics
*/}}
{{- if and .Values.historyServer.enabled .Values.historyServer.observability.enabled .Values.historyServer.observability.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "spark-3.5.fullname" . }}-history
  labels:
    app: spark-history-server
    app.kubernetes.io/component: history-server
    {{- include "spark-3.5.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: spark-history-server
      {{- include "spark-3.5.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.historyServer.observability.metrics.path | default "/metrics" }}
      scheme: http
      interval: 30s
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
