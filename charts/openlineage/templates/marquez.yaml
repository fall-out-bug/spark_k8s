apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-marquez-config
  namespace: {{ .Values.marquez.namespace | default .Release.Namespace }}
data:
  marquez.yml: |
    server:
      applicationConnectors:
      - type: http
        port: {{ .Values.service.apiPort }}
      adminConnectors:
      - type: http
        port: {{ add .Values.service.apiPort 1 }}
    db:
      driverClass: org.postgresql.Driver
      url: jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}
      user: {{ .Values.postgres.user }}
      password: {{ .Values.postgres.password }}
    migrateOnStartup: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Values.marquez.namespace | default .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
        imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgres.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.password | quote }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources: {{ toYaml .Values.postgres.resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: {{ .Values.postgres.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Values.marquez.namespace | default .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-marquez
  namespace: {{ .Values.marquez.namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-marquez
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-marquez
    spec:
      containers:
      - name: marquez
        image: {{ .Values.marquez.image.repository }}:{{ .Values.marquez.image.tag }}
        imagePullPolicy: {{ .Values.marquez.image.pullPolicy }}
        args:
        - ./wait-for-postgres.sh
        - {{ .Release.Name }}-postgres
        - "5432"
        - ./marquez.api.sh
        env:
        - name: MARQUEZ_CONFIG
          value: /config/marquez.yml
        - name: POSTGRES_HOST
          value: {{ .Release.Name }}-postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: {{ .Values.postgres.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.password | quote }}
        ports:
        - name: api
          containerPort: {{ .Values.service.apiPort }}
        resources: {{ toYaml .Values.marquez.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /config
      - name: web
        image: {{ .Values.marquez.webImage.repository }}:{{ .Values.marquez.webImage.tag }}
        imagePullPolicy: {{ .Values.marquez.webImage.pullPolicy }}
        env:
        - name: MARQUEZ_HOST
          value: {{ .Release.Name }}-marquez
        - name: MARQUEZ_PORT
          value: {{ .Values.service.apiPort | quote }}
        ports:
        - name: web
          containerPort: {{ .Values.service.webPort }}
        resources: {{ toYaml .Values.marquez.webResources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ .Release.Name }}-marquez-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-marquez
  namespace: {{ .Values.marquez.namespace | default .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-marquez
  ports:
  - name: api
    port: {{ .Values.service.apiPort }}
    targetPort: api
  - name: web
    port: {{ .Values.service.webPort }}
    targetPort: web
