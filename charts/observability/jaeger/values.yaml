# Jaeger values for Spark tracing on Kubernetes (WS-016-03)
# AC1: Jaeger chart, AC2: OTel, AC3: propagation, AC4: SQL, AC5: shuffle, AC6: UI
# Jaeger v2 accepts OTLP on 4317 (gRPC) and 4318 (HTTP) by default

# Target namespace for Spark pods
targetNamespace: spark-operations

# Jaeger subchart - all-in-one with default config (OTLP + memory + 10% sampling)
jaeger:
  enabled: true
  replicas: 1
  ingress:
    enabled: true
    hosts:
      - jaeger.spark.local
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Spark OTLP endpoint: use when configuring connect.openTelemetry.endpoint
# Format: http://<release>-jaeger:4317 (gRPC)
sparkOtelEndpoint: "http://jaeger:4317"
