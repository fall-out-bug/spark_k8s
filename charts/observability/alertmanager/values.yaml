# AlertManager values for Spark alerting (WS-016-05)
# AC1: chart, AC2: critical, AC3: warning, AC4: Slack, AC5: inhibit, AC6: rules

targetNamespace: spark-operations

# AlertManager subchart config
alertmanager:
  config:
    enabled: true
    global:
      resolve_timeout: 5m
      # Slack webhook: set via secret or --set alertmanager.config.global.slack_api_url
      # slack_api_url: ${SLACK_WEBHOOK_URL}

    route:
      receiver: slack-default
      group_by: [alertname, cluster, service]
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      routes:
        - match:
            severity: critical
          receiver: slack-critical
        - match:
            severity: warning
          receiver: slack-warning
        - match:
            severity: info
          receiver: slack-info

    receivers:
      - name: slack-critical
        slack_configs:
          - channel: "#spark-alerts-critical"
            title: "CRITICAL: {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
      - name: slack-warning
        slack_configs:
          - channel: "#spark-alerts-warning"
            title: "WARNING: {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
      - name: slack-info
        slack_configs:
          - channel: "#spark-alerts-info"
            title: "INFO: {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
      - name: slack-default
        slack_configs:
          - channel: "#spark-alerts"

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: [alertname, cluster, service]
