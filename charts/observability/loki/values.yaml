# Loki values for Spark log aggregation on Kubernetes (WS-016-02)
# AC1: Loki chart, AC2: Promtail, AC3: JSON, AC4: trace_id, AC5: sampling, AC6: Grafana datasource

targetNamespace: spark-operations

# Subchart "loki" (grafana/loki) — values under "loki" key are passed to subchart
# SingleBinary mode for Spark demo (lightweight; avoids write/read/backend StatefulSets)
# Demo budget: 6 CPU / 48Gi — chunks-cache default 8Gi blows budget; reduce to 256Mi
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    allocatedMemory: 256  # Default 8192MB exceeds demo budget; 256MB for minikube
  resultsCache:
    allocatedMemory: 128  # Default 1024MB; 128MB for demo
  loki:
    auth_enabled: false
    useTestSchema: true
    commonConfig:
      replication_factor: 1
    storage:
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin

# Promtail ConfigMap (promtail-spark.yaml)
promtail:
  enabled: true

# AC6: Grafana datasource URL for Loki
grafanaDatasourceUrl: "http://loki:3100"
