# Loki values for Spark log aggregation on Kubernetes (WS-016-02)
# AC1: Loki chart, AC2: Promtail, AC3: JSON, AC4: trace_id, AC5: sampling, AC6: Grafana datasource

targetNamespace: spark-operations

# Loki subchart - SingleBinary mode for Spark (lightweight)
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
# Subchart "loki" receives these; it expects Values.loki.*
loki:
  loki:
    auth_enabled: false
    useTestSchema: true
    commonConfig:
      replication_factor: 1
    storage:
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin

# Promtail ConfigMap (promtail-spark.yaml)
promtail:
  enabled: true

# AC6: Grafana datasource URL for Loki
grafanaDatasourceUrl: "http://loki:3100"
