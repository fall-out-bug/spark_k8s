# Prometheus values for Spark monitoring on Kubernetes (WS-016-01)
# AC5: scrape 15s, AC6: retention 15d, AC4: kube-state-metrics
# targetNamespace: Spark namespace to scrape. Use --set targetNamespace=spark-infra for demo.

targetNamespace: spark-operations

# Values for our ServiceMonitor template (servicemonitor.yaml uses targetNamespace)
prometheus:
  enabled: true
  serviceMonitors:
    namespace: spark-operations  # fallback when targetNamespace not set
    interval: 15s
  scrapeInterval: 15s
  scrapeTimeout: 10s
  evaluationInterval: 15s

# Pass to prometheus-operator subchart (AC4, AC5, AC6)
prometheus-operator:
  prometheus:
    prometheusSpec:
      scrapeInterval: 15s
      retention: 15d
      retentionSize: ""
  kubeStateMetrics:
    enabled: true
    serviceMonitor:
      interval: 15s
  nodeExporter:
    enabled: true

server:
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
  service:
    port: 9090
    targetPort: 9090

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

storage:
  volumeClaimTemplate:
    spec:
      storageClassName: standard
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  retention:
    size: 10Gi
