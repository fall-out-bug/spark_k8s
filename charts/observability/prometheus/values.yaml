# Prometheus values for Spark monitoring on Kubernetes (WS-016-01)
# AC5: scrape 15s, AC6: retention 15d, AC4: kube-state-metrics

targetNamespace: spark-operations

# Values for our ServiceMonitor template
prometheus:
  enabled: true
  serviceMonitors:
    namespace: spark-operations
    interval: 15s
    items:
      - name: spark-driver
        namespace: spark-operations
        selector:
          app: spark
          spark-role: driver
        endpoints:
          - port: metrics
            path: /metrics/prometheus
        interval: 15s
      - name: spark-executor
        namespace: spark-operations
        selector:
          app: spark
          spark-role: executor
        endpoints:
          - port: metrics
            path: /metrics/prometheus
        interval: 15s

  podMonitors:
    - name: spark-driver-pods
      namespace: spark-operations
      selector:
        app: spark
        spark-role: driver
      podMetricsEndpoints:
        - port: metrics
          path: /metrics/prometheus
      interval: 15s

    - name: spark-executor-pods
      namespace: spark-operations
      selector:
        app: spark
        spark-role: executor
      podMetricsEndpoints:
        - port: metrics
          path: /metrics/prometheus
      interval: 15s

  scrapeInterval: 15s
  scrapeTimeout: 10s
  evaluationInterval: 15s

# Pass to prometheus-operator subchart (AC4, AC5, AC6)
prometheus-operator:
  prometheus:
    prometheusSpec:
      scrapeInterval: 15s
      retention: 15d
      retentionSize: ""
  kubeStateMetrics:
    enabled: true
    serviceMonitor:
      interval: 15s
  nodeExporter:
    enabled: true

server:
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
  service:
    port: 9090
    targetPort: 9090

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

storage:
  volumeClaimTemplate:
    spec:
      storageClassName: standard
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  retention:
    size: 10Gi
