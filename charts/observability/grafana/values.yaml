# Grafana values for Spark dashboards on Kubernetes
#
# Grafana configuration for Spark monitoring dashboards
# Data sources: Prometheus, Loki, Jaeger
#
grafana:
  enabled: true
  sidecar:
    dashboards:
      enabled: true
    alerts:
      enabled: false
  image:
    repository: grafana/grafana
    tag: 11.0.0

  # Admin credentials
  admin:
    existingSecret: grafana-admin
    usernameKey: admin
    passwordKey: admin

  # Service configuration
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  # Data sources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        # Prometheus datasource for metrics
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-operator:9090
          isDefault: true
          editable: false
          jsonData:
            timeInterval: 30s
            httpMethod: POST
            exemplarTraceIdLink: true

        # Loki datasource for logs
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          editable: false
          jsonData:
            maxLines: 1000
            timeInterval: 30s
            deriveField: true

        # Jaeger datasource for traces (all-in-one service)
        - name: Jaeger
          type: jaeger
          access: proxy
          url: http://jaeger:16686
          editable: false

  # Dashboard providers (AC6: auto-provision)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - disableDeletion: false
          folder: "Spark"
          name: spark
          options:
            path: /var/lib/grafana/dashboards/spark
          type: file
          allowUiUpdates: true
        - disableDeletion: false
          folder: "Operations"
          name: ops
          options:
            path: /var/lib/grafana/dashboards/ops
          type: file
          allowUiUpdates: true

  # Dashboards (AC5: 5+ dashboards, AC5 WS-016-06: spark-overview unified view)
  dashboards:
    spark:
      spark-overview:
        file: dashboards/spark-overview.json
      performance-analysis:
        file: dashboards/performance-analysis.json
      spark-jvm-performance:
        file: dashboards/spark-jvm-performance.json
      jvm-overview:
        file: dashboards/jvm-overview.json
      spark-operator-scale:
        file: dashboards/spark-operator-scale.json
    ops:
      backup-status:
        file: dashboards/backup-status.json
      budget-status:
        file: dashboards/budget-status.json
      chaos-metrics:
        file: dashboards/chaos-metrics.json
      cost-by-job:
        file: dashboards/cost-by-job.json
      cost-by-team:
        file: dashboards/cost-by-team.json
      incident-metrics:
        file: dashboards/incident-metrics.json
      slo-forecast:
        file: dashboards/slo-forecast.json
      dcgm-exporter:
        file: dashboards/dcgm-exporter.json
      minio-overview:
        file: dashboards/minio-overview.json
      airflow-cluster:
        file: dashboards/airflow-cluster.json
      airflow-statsd:
        file: dashboards/airflow-statsd.json

  # Resource configuration
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Persistence
  persistence:
    type: pvc
    enabled: true
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    size: 5Gi

# Environment variables
env:
  # Grafana environment
  GF_SECURITY_ALLOW_EMBEDDING: "true"
  GF_SERVER_ROOT_URL: "http://grafana:3000"
  GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel"

# Ingress configuration
ingress:
  enabled: false
  hosts:
    - grafana.s7.local
