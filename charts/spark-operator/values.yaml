image:
  registry: ghcr.io
  repository: kubeflow/spark-operator/controller
  tag: "v2.5.1"
  pullPolicy: IfNotPresent

replicas: 1

sparkJobNamespace: "default"

webhook:
  enable: true
  port: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

rbac:
  create: true

# CRD installation control
crds:
  create: true
