[project]
name = "spark-k8s"
version = "0.1.0"
description = "Spark on Kubernetes Helm charts and tooling"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "7.0"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "security: Helm template security validation",
    "e2e: End-to-end tests requiring live cluster",
    "slow: Tests that take >30s",
    "observability: Observability smoke tests (helm template on observability-demo)",
]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
    ".git", "__pycache__", ".venv", "venv", "build", "dist", "*.egg-info", ".sdp",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]
include = '\\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.venv
  | venv
  | build
  | dist
  | \\.sdp
  | \\*\\.egg-info
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict = true
ignore_missing_imports = true
