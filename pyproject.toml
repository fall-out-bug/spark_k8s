[project]
name = "spark-k8s"
version = "0.1.0"
description = "Spark on Kubernetes Helm charts and tooling"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "7.0"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "security: Helm template security validation",
    "e2e: End-to-end tests requiring live cluster",
    "slow: Tests that take >30s",
    "observability: Observability smoke tests (helm template on observability-demo)",
]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
    ".git", "__pycache__", ".venv", "venv", "build", "dist", "*.egg-info", ".sdp",
    "notebooks/",  # Notebooks: pre-existing JSON schema issues, separate lint
    "examples/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module-level import not at top (common in scripts/notebooks)
    "E722",  # bare except (legacy code)
    "N802",  # function name should be lowercase (Spark Listener onApplicationStart etc.)
    "N803",  # argument name should be lowercase (X_train, X_test in ML code)
    "N806",  # variable in function should be lowercase (X_train, X_test in ML code)
    "N812",  # lowercase imported as non-lowercase (udf as F convention)
    "F403",  # import * used (pyspark types wildcard)
    "F821",  # undefined name (false positives in pyspark dynamic imports)
    "SIM102",  # collapsible if (readability)
    "SIM105",  # try/except/pass → contextlib.suppress (legibility)
]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]
include = '\\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.venv
  | venv
  | build
  | dist
  | \\.sdp
  | \\*\\.egg-info
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict = true
ignore_missing_imports = true
