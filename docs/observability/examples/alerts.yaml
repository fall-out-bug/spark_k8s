# Example Prometheus alert rules for spark_k8s constructor
# Metrics from demo-metrics-exporter (spark_*, airflow_*)
# Apply: add to Prometheus config or use PrometheusRule (Operator)
# Reference only — customize for your environment

groups:
  - name: spark-k8s
    rules:
      - alert: SparkMasterDown
        expr: demo_metrics_exporter_spark_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Spark Master unreachable"
          description: "demo-metrics-exporter cannot reach Spark Master API."

      - alert: SparkWorkerDown
        expr: spark_workers_alive < spark_workers_total
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Spark Worker(s) down"
          description: "One or more Spark workers are not alive."

      - alert: DemoMetricsExporterDown
        expr: demo_metrics_exporter_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Demo metrics exporter is down"
          description: "demo-metrics-exporter is not scraping Spark/Airflow."

  - name: airflow
    rules:
      - alert: AirflowDAGFailed
        expr: airflow_dag_runs_state{state="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Airflow DAG run failed"
          description: "DAG {{ $labels.dag_id }} has failed runs."

      - alert: AirflowTaskFailed
        expr: airflow_task_instances_state{state="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Airflow task failed"
          description: "DAG {{ $labels.dag_id }} has failed task instances."
