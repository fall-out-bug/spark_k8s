# Pre-commit hooks for spark_k8s
# Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(dags/|docker/|notebooks/|charts/.*/charts/_.*archived/)

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [--config=pyproject.toml]
        exclude: ^(dags/|docker/|notebooks/|charts/.*/charts/_.*archived/)

  # Conventional Commits enforcement (replaces SDP commit-msg.sh)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, style, chore, perf, ci, build, revert]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        args: [--config-file=pyproject.toml]
        exclude: ^(tests/|scripts/|examples/|docker/|charts/.*/dags/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # allow-multiple-documents: legit multi-doc manifests (e.g.
        # scripts/manifests/*.yaml) are single files with --- separators
        args: [--allow-multiple-documents]
        # Exclude: rendered/template YAML, evidence snapshots, and non-source dirs:
        #  - _archived/ : frozen legacy workflows (pre-existing multi-doc YAML quirks)
        #  - k8s/       : raw multi-document manifests (pre-chart legacy), not single-doc source
        #  - *.jinja2.yaml : Jinja2 templates (not valid YAML until rendered)
        exclude: ^(tests/observability/|tests/evidence/|charts/.*/templates/|\.github/workflows/_archived/|k8s/|.*\.jinja2\.yaml$)
      - id: check-json
        # notebooks/ excluded: pre-existing JSON quirks in hand-edited .ipynb sources,
        # consistent with ruff/black notebook excludes.
        exclude: ^notebooks/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # ShellCheck for shell scripts (excludes upstream/generated scripts)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # severity=error matches CI (ci.yml runs `shellcheck -S error`) — a stricter
        # local gate would fail on ~30 pre-existing SC2034/SC2155 warnings in
        # docker/docker-base & docker/runtime build/test scripts.
        args: [--severity=error]
        # Exclude: spec-kit upstream scripts, agent tooling, and generated smoke
        # scenarios. The smoke scenarios (scripts/tests/smoke/scenarios/*.sh) are
        # produced by a matrix generator that emits IMAGE_REPOSITORY="spark-custom"
        # in every file even where unused (SC2034 in ~73 files). The generator is
        # the root cause — tracked in specs/smoke-scenario-generator-cleanup/.
        exclude: ^scripts/tests/smoke/scenarios/|^scripts/tests/e2e/|^scripts/tests/load/|^scripts/load-|^scripts/testing/|^scripts/deploy-|^scripts/recipes/

  # Helm lint (optional - requires helm installed)
  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: helm lint charts/spark-4.1 charts/spark-3.5 charts/spark-base
        language: system
        pass_filenames: false
        stages: [manual]  # Run manually, not on every commit
