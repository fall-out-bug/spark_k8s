# S3 credentials secret.
# This is a TEMPLATE — do NOT apply with hardcoded values in production.
# Create real secrets via one of:
#   kubectl create secret generic s3-credentials -n spark \
#     --from-literal=access-key="$S3_ACCESS_KEY" --from-literal=secret-key="$S3_SECRET_KEY"
#   OR ExternalSecrets / SealedSecrets / Vault (see docs/recipes/security/credential-management.md)
#
# For local minikube demo only, you may apply this directly after setting env:
#   envsubst < k8s/base/secrets.yaml | kubectl apply -f -
# with S3_ACCESS_KEY, S3_SECRET_KEY, POSTGRES_USER, POSTGRES_PASSWORD exported.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: spark
type: Opaque
stringData:
  access-key: "${S3_ACCESS_KEY}"
  secret-key: "${S3_SECRET_KEY}"
---
# JDBC credentials for databases (used by notebooks)
apiVersion: v1
kind: Secret
metadata:
  name: jdbc-credentials
  namespace: spark
type: Opaque
stringData:
  postgres-user: "${POSTGRES_USER:-spark}"
  postgres-password: "${POSTGRES_PASSWORD}"
